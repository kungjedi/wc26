<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }

  h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(36px, 8vw, 68px); letter-spacing: 2px; color: var(--accent); line-height: 1; }
  .subtitle { color: var(--muted); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab-btn { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; padding: 12px 28px; background: none; border: none; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 10px 24px; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--muted); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-bbc { background: #e8f0e8; }
  .dot-itv { background: var(--accent2); }
  .dot-both { background: var(--accent); }
  .dot-tbc { background: var(--muted); }
  .filters { display: flex; align-items: center; gap: 8px; padding: 10px 24px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .filter-label { color: var(--muted); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-right: 4px; }
  .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 5px 14px; cursor: pointer; letter-spacing: 0.5px; transition: all 0.15s; }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #0a0f0a; font-weight: 500; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 8px 24px; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 45px; z-index: 9; }
  td { padding: 9px 24px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(200,240,0,0.03); }
  tr.hidden { display: none; }
  .time { color: var(--accent); font-weight: 500; white-space: nowrap; }
  .score { color: var(--accent); font-weight: 500; white-space: nowrap; letter-spacing: 2px; }
  .score-ft { font-size: 10px; color: var(--muted); margin-left: 4px; }
  .match { font-weight: 500; }
  .match .vs { color: var(--muted); margin: 0 4px; }
  .group-badge { display: inline-block; background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-size: 10px; padding: 1px 6px; letter-spacing: 1px; min-width: 28px; text-align: center; }
  .group-badge.knockout-badge { color: var(--accent2); border-color: var(--accent2); }
  .channel { white-space: nowrap; }
  .ch-bbc { color: #e8f0e8; }
  .ch-itv { color: var(--accent2); }
  .ch-both { color: var(--accent); font-weight: 500; }
  .ch-tbc { color: var(--muted); }
  .city { color: var(--muted); font-size: 11px; }
  .date-header { padding: 10px 24px 6px; font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--border); }
  .date-header.knockout { color: var(--accent2); }
  .date-header.final-day { color: var(--accent); }
  .final-row td { background: rgba(200,240,0,0.06); }
  .final-row .match { color: var(--accent); }
  .played-row td { opacity: 0.6; }
  .played-row:hover td { opacity: 1; }
  .standings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1px; background: var(--border); }
  .group-card { background: var(--bg); padding: 0; }
  .group-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; color: var(--accent); padding: 14px 20px 8px; border-bottom: 1px solid var(--border); }
  .standings-table { width: 100%; border-collapse: collapse; }
  .standings-table th { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); padding: 6px 8px; text-align: center; border-bottom: 1px solid var(--border); background: var(--surface); position: static; }
  .standings-table th.left { text-align: left; padding-left: 20px; }
  .standings-table td { padding: 8px 8px; border-bottom: 1px solid var(--border); text-align: center; font-size: 12px; }
  .standings-table td.team-name { text-align: left; padding-left: 20px; font-weight: 500; }
  .standings-table tr:last-child td { border-bottom: none; }
  .standings-table tr:hover td { background: rgba(200,240,0,0.03); }
  .pos { color: var(--muted); font-size: 11px; width: 24px; }
  .pts { color: var(--accent); font-weight: 500; }
  .qual-line { border-top: 2px solid var(--accent2) !important; }
  .standings-note { padding: 8px 20px; font-size: 10px; color: var(--muted); border-top: 1px solid var(--border); letter-spacing: 0.5px; }
  .last-updated { padding: 12px 24px; font-size: 10px; color: var(--muted); border-bottom: 1px solid var(--border); letter-spacing: 1px; }
  @media (max-width: 600px) {
    td, th { padding: 8px 12px; }
    .city { display: none; }
    h1 { font-size: 40px; }
    .standings-grid { grid-template-columns: 1fr; }
  }
</style>

const LAST_UPDATED="Pre-tournament \u00B7 No matches played yet";

function chClass(ch){
  if(["BBC","BBC One","BBC Two"].includes(ch)) return "ch-bbc";
  if(["ITV","ITV1","ITV4"].includes(ch)) return "ch-itv";
  if(ch==="BBC & ITV") return "ch-both";
  return "ch-tbc";
}
function isKnockout(s){return [R32,R16,QF,SF,TP,FIN].includes(s);}
function gd(t){return t.gf-t.ga;}

const matches=rawMatches.map(m=>({...m,m:withFlags(m.m)}));
const tbody=document.getElementById("schedule");
let lastDate=null,lastStage=null;
const allRows=[];

matches.forEach(m=>{
  let headerRow=null;
  if(m.date!==lastDate){
    const stageLabel=isKnockout(m.stage)?m.stage:"GROUP STAGE";
    const stageChanged=stageLabel!==lastStage;
    lastStage=stageLabel;
    headerRow=document.createElement("tr");
    headerRow.className="date-header-row";
    headerRow.innerHTML=`<td colspan="5" style="padding:0"><div class="date-header ${m.stage===FIN?'final-day':isKnockout(m.stage)?'knockout':''}">${m.date}${stageChanged&&isKnockout(m.stage)?' \u00B7 <span style="font-size:14px;opacity:0.7">'+m.stage+'</span>':''}</div></td>`;
    tbody.appendChild(headerRow);
    lastDate=m.date;
  }
  const tr=document.createElement("tr");
  if(m.stage===FIN) tr.classList.add("final-row");
  if(m.score!==null) tr.classList.add("played-row");
  const ko=isKnockout(m.stage);
  const matchText=m.m.includes(" v ")?m.m.replace(" v ",`<span class="vs">v</span>`):m.m;
  const timeCell=m.score!==null
    ?`<span class="score">${m.score[0]}\u2013${m.score[1]}<span class="score-ft">FT</span></span>`
    :`<span class="time">${m.bst}</span>`;
  tr.innerHTML=`<td>${timeCell}</td><td class="match">${matchText}</td><td><span class="group-badge ${ko?'knockout-badge':''}">${m.g}</span></td><td class="channel ${chClass(m.ch)}">${m.ch}</td><td class="city">${m.city}</td>`;
  tbody.appendChild(tr);
  const rawMatch=m.m.replace(/[\u{1F000}-\u{1FFFF}]|[\u{2600}-\u{27FF}]|\uD83C[\uDF00-\uDFFF]|\uD83D[\uDC00-\uDE4F]/gu,'').trim();
  const teams=rawMatch.split(' v ').map(t=>t.trim());
  allRows.push({matchRow:tr,headerRow,teams,date:m.date});
});

function applyFilter(filter){
  const visibleDates=new Set();
  allRows.forEach(({matchRow,teams,date})=>{
    const visible=filter==='all'||teams.some(t=>t.includes(filter));
    matchRow.classList.toggle('hidden',!visible);
    if(visible) visibleDates.add(date);
  });
  const seenDates=new Set();
  allRows.forEach(({headerRow,date})=>{
    if(!headerRow||seenDates.has(date)) return;
    seenDates.add(date);
    headerRow.classList.toggle('hidden',!visibleDates.has(date));
  });
}
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    applyFilter(btn.dataset.filter);
  });
});

document.getElementById("last-updated").textContent="Standings updated: "+LAST_UPDATED;
const grid=document.getElementById("standings-grid");
Object.entries(groupsData).forEach(([grpLetter,grp])=>{
  const sorted=[...grp.teams].sort((a,b)=>b.pts-a.pts||(gd(b)-gd(a))||b.gf-a.gf||a.name.localeCompare(b.name));
  const card=document.createElement("div");
  card.className="group-card";
  card.innerHTML=`<div class="group-title">Group ${grpLetter}</div><table class="standings-table"><thead><tr><th class="left" colspan="2">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>${sorted.map((t,i)=>`<tr class="${i===2?'qual-line':''}"><td class="pos">${i+1}</td><td class="team-name">${withFlags(t.name)}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td><td>${t.ga}</td><td style="color:${gd(t)>0?'var(--accent)':gd(t)<0?'var(--accent2)':'var(--muted)'}">${gd(t)>0?'+':''}${gd(t)}</td><td class="pts">${t.pts}</td></tr>`).join('')}</tbody></table><div class="standings-note">Top 2 qualify \u00B7 <span style="color:var(--accent2)">\u2500</span> qualification line</div>`;
  grid.appendChild(card);
});
