<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0f0a; --surface:#111811; --border:#273c27; --accent:#c8f000; --accent2:#ff4a1c; --text:#e8f0e8; --muted:#7a9e7a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:13px; line-height:1.4; min-height:100vh; }
  header { padding:28px 24px 16px; border-bottom:1px solid var(--border); display:flex; align-items:baseline; gap:20px; flex-wrap:wrap; }
  h1 { font-family:'Bebas Neue',sans-serif; font-size:clamp(36px,8vw,68px); letter-spacing:2px; color:var(--accent); line-height:1; }
  .subtitle { color:var(--muted); font-size:11px; letter-spacing:2px; text-transform:uppercase; }
  .tabs { display:flex; border-bottom:1px solid var(--border); }
  .tab-btn { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:1px; padding:12px 16px; background:none; border:none; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-1px; transition:all 0.15s; }
  .tab-btn:hover { color:var(--text); }
  .tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; padding:10px 24px; border-bottom:1px solid var(--border); font-size:11px; color:var(--muted); }
  .legend span { display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; }
  .dot-bbc{background:#e8f0e8;} .dot-itv{background:var(--accent2);} .dot-both{background:var(--accent);} .dot-tbc{background:var(--muted);}
  .filters { display:flex; align-items:center; gap:8px; padding:10px 24px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .filter-label { color:var(--muted); font-size:11px; letter-spacing:2px; text-transform:uppercase; margin-right:4px; }
  .filter-btn { background:var(--surface); border:1px solid var(--border); color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:12px; padding:5px 14px; cursor:pointer; letter-spacing:0.5px; transition:all 0.15s; }
  .filter-btn:hover { border-color:var(--accent); color:var(--text); }
  .filter-btn.active { background:var(--accent); border-color:var(--accent); color:#0a0f0a; font-weight:500; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; padding:8px 24px; font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--border); background:var(--bg); position:sticky; top:45px; z-index:9; }
  td { padding:9px 24px; border-bottom:1px solid var(--border); }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:rgba(200,240,0,0.03); }
  tr.hidden { display:none; }
  .time { color:var(--accent); font-weight:500; white-space:nowrap; }
  .score { color:var(--accent); font-weight:500; white-space:nowrap; letter-spacing:2px; }
  .score-ft { font-size:10px; color:var(--muted); margin-left:4px; }
  a.score-link { color:inherit; text-decoration:none; }
  a.score-link:hover .score { text-decoration:underline; text-underline-offset:3px; }
  .match { font-weight:500; }
  .match .vs { color:var(--muted); margin:0 4px; }
  .group-badge { display:inline-block; background:var(--surface); border:1px solid var(--border); color:var(--muted); font-size:10px; padding:1px 6px; letter-spacing:1px; min-width:28px; text-align:center; }
  .group-badge.ko { color:var(--accent2); border-color:var(--accent2); }
  .channel { white-space:nowrap; }
  .ch-bbc{color:#e8f0e8;} .ch-itv{color:var(--accent2);} .ch-both{color:var(--accent);font-weight:500;} .ch-tbc{color:var(--muted);}
  .city { color:var(--muted); font-size:11px; }
  .date-header { padding:10px 24px 6px; font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:1px; color:var(--muted); background:var(--surface); border-bottom:1px solid var(--border); }
  .date-header.ko { color:var(--accent2); }
  .date-header.final { color:var(--accent); }
  .final-row td { background:rgba(200,240,0,0.06); }
  .final-row .match { color:var(--accent); }
  .no-results { padding:48px 24px; color:var(--muted); font-size:13px; letter-spacing:1px; }
  td.rt-left { text-align:right; padding-right:12px; width:38%; font-weight:500; }
  td.rt-right { text-align:left; padding-left:12px; width:38%; font-weight:500; }
  td.rt-score { text-align:center; width:80px; }
  .standings-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:1px; background:var(--border); }
  .group-card { background:var(--bg); }
  .group-title { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:1px; color:var(--accent); padding:14px 20px 8px; border-bottom:1px solid var(--border); }
  .st { width:100%; border-collapse:collapse; }
  .st th { font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); padding:6px 8px; text-align:center; border-bottom:1px solid var(--border); background:var(--surface); position:static; }
  .st th.left { text-align:left; padding-left:20px; }
  .st td { padding:8px; border-bottom:1px solid var(--border); text-align:center; font-size:12px; }
  .st td.tn { text-align:left; padding-left:20px; font-weight:500; }
  .st tr:last-child td { border-bottom:none; }
  .st tr:hover td { background:rgba(200,240,0,0.03); }
  .pos { color:var(--muted); font-size:11px; }
  .pts { color:var(--accent); font-weight:500; }
  .qual-line { border-top:2px solid var(--accent2) !important; }
  .sn { padding:8px 20px; font-size:10px; color:var(--muted); border-top:1px solid var(--border); }
  .last-updated { padding:12px 24px; font-size:10px; color:var(--muted); border-bottom:1px solid var(--border); letter-spacing:1px; }
  .loading { padding:48px 24px; color:var(--muted); letter-spacing:2px; font-size:11px; text-transform:uppercase; }
  .funny-item { padding:20px 24px; border-bottom:1px solid var(--border); }
  .funny-item:last-child { border-bottom:none; }
  .funny-item:hover { background:rgba(200,240,0,0.03); }
  .funny-headline { color:var(--accent); font-weight:500; font-size:14px; text-decoration:none; display:block; margin-bottom:8px; line-height:1.4; }
  .funny-headline:hover { text-decoration:underline; text-underline-offset:3px; }
  .funny-summary { color:var(--text); font-size:12px; line-height:1.7; }
  @media(max-width:600px){
    td,th{padding:8px 12px;}
    .city{display:none;}
    h1{font-size:40px;}
    .standings-grid{grid-template-columns:1fr;}
    td.rt-left,td.rt-right{font-size:11px;}
  }
</style>
</head>
<body>
<header>
  <h1>World Cup 2026</h1>
  <div class="subtitle">All times BST &middot; Free to air &middot; BBC &amp; ITV</div>
</header>
<div class="tabs">
  <button class="tab-btn active" data-tab="schedule">Schedule</button>
  <button class="tab-btn" data-tab="results">Results</button>
  <button class="tab-btn" data-tab="standings">Standings</button>
  <button class="tab-btn" data-tab="funnies">Funnies</button>
</div>
<div id="tab-schedule" class="tab-panel active">
  <div class="legend">
    <span><span class="dot dot-bbc"></span> BBC</span>
    <span><span class="dot dot-itv"></span> ITV</span>
    <span><span class="dot dot-both"></span> BBC &amp; ITV</span>
    <span><span class="dot dot-tbc"></span> TBC</span>
  </div>
  <div class="filters">
    <span class="filter-label">Filter:</span>
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="England">&#x1F3F4;&#xE0067;&#xE0062;&#xE0065;&#xE006E;&#xE0067;&#xE007F; England</button>
    <button class="filter-btn" data-filter="Scotland">&#x1F3F4;&#xE0067;&#xE0062;&#xE0073;&#xE0063;&#xE0074;&#xE007F; Scotland</button>
    <button class="filter-btn" data-filter="Portugal">&#x1F1F5;&#x1F1F9; Portugal</button>
    <button class="filter-btn" data-filter="Sweden">&#x1F1F8;&#x1F1EA; Sweden</button>
    <button class="filter-btn" data-filter="Cape Verde">&#x1F1E8;&#x1F1FB; Cape Verde</button>
  </div>
  <table>
    <thead><tr>
      <th style="width:100px">BST</th><th>Match</th>
      <th style="width:60px">Grp</th><th style="width:110px">Channel</th><th style="width:160px">City</th>
    </tr></thead>
    <tbody id="schedule"><tr><td colspan="5" class="loading">Loading fixtures&hellip;</td></tr></tbody>
  </table>
</div>
<div id="tab-results" class="tab-panel">
  <div class="last-updated" id="results-updated"></div>
  <div id="results-wrap"><div class="loading">Loading results&hellip;</div></div>
</div>
<div id="tab-funnies" class="tab-panel">
  <div id="funnies-wrap"><div class="loading">Loading&hellip;</div></div>
</div>
<div id="tab-standings" class="tab-panel">
  <div class="last-updated" id="standings-updated"></div>
  <div class="standings-grid" id="standings-grid"><div class="loading" style="grid-column:1/-1">Loading standings&hellip;</div></div>
</div>
<script>
function flags(n){
  if(!n) return n;
  return n
    .replace(/\bEngland\b/g,"\u{1F3F4}\u{E0067}\u{E0062}\u{E0065}\u{E006E}\u{E0067}\u{E007F} England")
    .replace(/\bScotland\b/g,"\u{1F3F4}\u{E0067}\u{E0062}\u{E0073}\u{E0063}\u{E0074}\u{E007F} Scotland")
    .replace(/\bPortugal\b/g,"\u{1F1F5}\u{1F1F9} Portugal")
    .replace(/\bSweden\b/g,"\u{1F1F8}\u{1F1EA} Sweden")
    .replace(/\bCape Verde\b/g,"\u{1F1E8}\u{1F1FB} Cape Verde");
}
const KO_STAGES=["R32","R16","QF","SF","TP","FIN"];
function isKO(s){return KO_STAGES.includes(s);}
function chClass(ch){
  if(["BBC","BBC One","BBC Two"].includes(ch)) return "ch-bbc";
  if(["ITV","ITV1","ITV4"].includes(ch)) return "ch-itv";
  if(ch==="BBC & ITV") return "ch-both";
  return "ch-tbc";
}
function gd(t){return t.gf-t.ga;}

fetch("scores.json?v="+Date.now())
  .then(r=>r.json())
  .then(data=>{
    buildSchedule(data);
    buildResults(data);
    buildStandings(data);
    buildFunnies(data);
  })
  .catch(e=>{
    document.getElementById("schedule").innerHTML=`<tr><td colspan="5" class="loading">Error loading data: ${e.message}</td></tr>`;
  });

function buildSchedule(data){
  const tbody=document.getElementById("schedule");
  tbody.innerHTML="";
  const allRows=[];
  let lastDate=null,lastStage=null;
  data.fixtures.forEach(f=>{
    if(data.results[f.id]!==undefined) return;
    let headerRow=null;
    if(f.date!==lastDate){
      const sl=isKO(f.stage)?f.stage:"GROUP STAGE";
      const sc=sl!==lastStage; lastStage=sl;
      headerRow=document.createElement("tr");
      headerRow.innerHTML=`<td colspan="5" style="padding:0"><div class="date-header ${f.stage==="FIN"?"final":isKO(f.stage)?"ko":""}">${f.date}${sc&&isKO(f.stage)?' \u00B7 <span style="font-size:14px;opacity:0.7">'+f.stage+'</span>':''}</div></td>`;
      tbody.appendChild(headerRow);
      lastDate=f.date;
    }
    const ko=isKO(f.stage);
    const home=flags(f.home)||"TBD",away=flags(f.away)||"TBD";
    const tr=document.createElement("tr");
    if(f.stage==="FIN") tr.classList.add("final-row");
    tr.innerHTML=`<td><span class="time">${f.bst}</span></td><td class="match">${home} <span class="vs">v</span> ${away}</td><td><span class="group-badge ${ko?"ko":""} ">${f.group}</span></td><td class="channel ${chClass(f.channel)}">${f.channel}</td><td class="city">${f.city}</td>`;
    tbody.appendChild(tr);
    allRows.push({matchRow:tr,headerRow,home:f.home||"",away:f.away||"",date:f.date});
  });
  if(!tbody.children.length) tbody.innerHTML=`<tr><td colspan="5" class="no-results">All matches complete!</td></tr>`;
  function applyFilter(filter){
    const vis=new Set();
    allRows.forEach(({matchRow,home,away,date})=>{
      const show=filter==="all"||home.includes(filter)||away.includes(filter);
      matchRow.classList.toggle("hidden",!show);
      if(show) vis.add(date);
    });
    const seen=new Set();
    allRows.forEach(({headerRow,date})=>{
      if(!headerRow||seen.has(date)) return;
      seen.add(date);
      headerRow.classList.toggle("hidden",!vis.has(date));
    });
  }
  document.querySelectorAll(".filter-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      applyFilter(btn.dataset.filter);
    });
  });
}

function buildResults(data){
  document.getElementById("results-updated").textContent="Updated: "+data._meta.last_updated;
  const wrap=document.getElementById("results-wrap");
  const played=data.fixtures.filter(f=>data.results[f.id]!==undefined).reverse();
  if(!played.length){
    wrap.innerHTML=`<div class="no-results">No results yet \u2014 check back after 11 June.</div>`;
    return;
  }
  let html=`<table><thead><tr><th style="width:38%;text-align:right">Home</th><th style="width:80px;text-align:center">Score</th><th style="width:38%">Away</th><th style="width:60px">Grp</th><th>Time</th></tr></thead><tbody>`;
  let lastDate=null;
  played.forEach(f=>{
    if(f.date!==lastDate){
      html+=`<tr><td colspan="5" style="padding:0"><div class="date-header">${f.date}</div></td></tr>`;
      lastDate=f.date;
    }
    const s=data.results[f.id];
    const ko=isKO(f.stage);
    const link=(data.highlight_links||{})[f.id];
    const scoreHtml=`<span class="score">${s[0]}\u2013${s[1]}</span>`;
    html+=`<tr><td class="rt-left">${flags(f.home)}</td><td class="rt-score">${link?`<a class="score-link" href="${link}" target="_blank" rel="noopener">${scoreHtml}</a>`:scoreHtml}</td><td class="rt-right">${flags(f.away)}</td><td><span class="group-badge ${ko?"ko":""} ">${f.group}</span></td><td class="city">${f.bst}</td></tr>`;
  });
  html+=`</tbody></table>`;
  wrap.innerHTML=html;
}

function buildStandings(data){
  document.getElementById("standings-updated").textContent="Updated: "+data._meta.last_updated;
  const grid=document.getElementById("standings-grid");
  grid.innerHTML="";
  Object.entries(data.standings).forEach(([grp,teams])=>{
    const sorted=[...teams].sort((a,b)=>b.pts-a.pts||(gd(b)-gd(a))||b.gf-a.gf||a.name.localeCompare(b.name));
    const card=document.createElement("div");
    card.className="group-card";
    card.innerHTML=`<div class="group-title">Group ${grp}</div><table class="st"><thead><tr><th class="left" colspan="2">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>${sorted.map((t,i)=>`<tr class="${i===2?"qual-line":""}" ><td class="pos">${i+1}</td><td class="tn">${flags(t.name)}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td><td>${t.ga}</td><td style="color:${gd(t)>0?"var(--accent)":gd(t)<0?"var(--accent2)":"var(--muted)"}">${gd(t)>0?"+":""}${gd(t)}</td><td class="pts">${t.pts}</td></tr>`).join("")}</tbody></table><div class="sn">Top 2 qualify &middot; <span style="color:var(--accent2)">\u2500</span> qualification line</div>`;
    grid.appendChild(card);
  });
}

function buildFunnies(data){
  const wrap=document.getElementById("funnies-wrap");
  const items=data.funnies||[];
  if(!items.length){
    wrap.innerHTML=`<div class="no-results">Nothing funny has happened yet &mdash; give it time.</div>`;
    return;
  }
  let html='';
  let lastDate=null;
  items.forEach(f=>{
    if(f.date!==lastDate){
      html+=`<div class="date-header">${f.date}</div>`;
      lastDate=f.date;
    }
    html+=`<div class="funny-item"><a class="funny-headline" href="${f.url}" target="_blank" rel="noopener">${f.headline}</a><p class="funny-summary">${f.summary}</p></div>`;
  });
  wrap.innerHTML=html;
}

document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tab-"+btn.dataset.tab).classList.add("active");
  });
});
</script>
</body>
</html>
